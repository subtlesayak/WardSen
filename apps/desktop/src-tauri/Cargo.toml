[package]
name = "wardsen"
version = "0.1.0"
description = "WardSen desktop shell"
authors = ["WardSen contributors"]
license = "Apache-2.0"
repository = "https://github.com/subtlesayak/WardSen"
edition = "2021"

[lib]
name = "wardsen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
default = []
