name: Build macOS Intel DMG

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build, for example v0.1.0"
        required: true
        default: "main"
        type: string
      release_tag:
        description: "Existing GitHub release tag to attach artifacts to"
        required: true
        default: "v0.1.0-rc.6"
        type: string

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "22"
  VITE_WARDSEN_RELEASE_TAG: ${{ inputs.release_tag }}
  WARDSEN_BUNDLE_ROOT: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle

jobs:
  build:
    name: Build macos-x64
    runs-on: macos-13
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Add Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Test
        run: npm test

      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            echo "MACOS_SIGNING_ENABLED is not true; skipping notarization key preparation."
            exit 0
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            key_path="$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Build macOS Intel installer
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            echo "MACOS_SIGNING_ENABLED is not true; building unsigned macOS Intel artifacts."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          fi
          npm run tauri:build -- --target x86_64-apple-darwin

      - name: Verify macOS signing and notarization
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            echo "MACOS_SIGNING_ENABLED is not true; leaving macOS Intel artifacts unsigned."
            exit 0
          fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY is not configured."
            exit 0
          fi
          ./installers/macos/verify-macos-artifacts.sh "$WARDSEN_BUNDLE_ROOT"

      - name: Generate checksums
        run: npm run release:checksums

      - name: Rename checksum file
        run: cp "$WARDSEN_BUNDLE_ROOT/SHA256SUMS.txt" "$WARDSEN_BUNDLE_ROOT/SHA256SUMS-macos-x64.txt"

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wardsen-macos-x64
          path: |
            apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/SHA256SUMS-*.txt
          if-no-files-found: error

  attach:
    name: Attach macOS Intel assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download macOS Intel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wardsen-macos-x64
          path: release-artifacts

      - name: Attach macOS Intel assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG does not exist; leaving assets in workflow artifact wardsen-macos-x64."
            exit 0
          fi
          find release-artifacts -type f \( -name "*.dmg" -o -name "SHA256SUMS-macos-x64.txt" \) -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
