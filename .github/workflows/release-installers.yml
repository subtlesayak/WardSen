name: Release Installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            build_args: "--bundles nsis"
            rust_target: ""
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/SHA256SUMS-*.txt
          - name: macos-x64
            os: macos-13
            build_args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/SHA256SUMS-*.txt
          - name: macos-arm64
            os: macos-14
            build_args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/SHA256SUMS-*.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Test
        run: npm test

      - name: Prepare Apple notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            echo "MACOS_SIGNING_ENABLED is not true; skipping notarization key preparation."
            exit 0
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            key_path="$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Build installer
        if: runner.os != 'macOS'
        run: npm run tauri:build -- ${{ matrix.build_args }}

      - name: Build macOS installer
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            echo "MACOS_SIGNING_ENABLED is not true; building unsigned macOS artifacts."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          fi
          npm run tauri:build -- ${{ matrix.build_args }}

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run tauri:build -- --bundles msi
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }

          Write-Host "Tauri MSI build failed; retrying WiX light.exe with validation suppression for the generated .wixobj."
          $light = Join-Path $env:LOCALAPPDATA "tauri\WixTools314\light.exe"
          if (-not (Test-Path -LiteralPath $light)) {
            throw "WiX light.exe was not found at $light"
          }
          & $light `
            -nologo `
            -spdb `
            -sval `
            -ext WixUIExtension `
            -cultures:en-us `
            -loc apps\desktop\src-tauri\target\release\wix\x64\locale.wxl `
            -out apps\desktop\src-tauri\target\release\bundle\msi\WardSen_0.1.0_x64_en-US.msi `
            apps\desktop\src-tauri\target\release\wix\x64\main.wixobj
          if ($LASTEXITCODE -ne 0) {
            throw "WiX fallback failed with exit code $LASTEXITCODE."
          }

      - name: Sign and verify Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) {
            Write-Host "WINDOWS_CERTIFICATE_BASE64 is not configured; leaving Windows artifacts unsigned."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "wardsen-code-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          powershell -ExecutionPolicy Bypass -File .\installers\windows\sign-windows-artifacts.ps1 -PfxPath $certPath -TimestampUrl $env:WINDOWS_TIMESTAMP_URL
          Remove-Item -LiteralPath $certPath -Force

      - name: Verify macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            echo "MACOS_SIGNING_ENABLED is not true; leaving macOS artifacts unsigned."
            exit 0
          fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY is not configured."
            exit 0
          fi
          ./installers/macos/verify-macos-artifacts.sh

      - name: Generate checksums
        run: npm run release:checksums

      - name: Rename checksum file
        shell: pwsh
        run: |
          Copy-Item `
            -LiteralPath apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt `
            -Destination apps/desktop/src-tauri/target/release/bundle/SHA256SUMS-${{ matrix.name }}.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wardsen-${{ matrix.name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease=true
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PRERELEASE" = "false" ]; then
            prerelease=false
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft=true --prerelease="$prerelease" --title "WardSen $RELEASE_TAG" --notes-file docs/release-notes/v0.1.0.md
          else
            gh release create "$RELEASE_TAG" --draft --prerelease="$prerelease" --title "WardSen $RELEASE_TAG" --notes-file docs/release-notes/v0.1.0.md
          fi
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
