name: Release Installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: true
        type: boolean
      publish:
        description: "Publish the release instead of leaving it as a draft"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "22"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  VITE_WARDSEN_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  VITE_WARDSEN_RELEASE_SCHEMA_VERSION: "1"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            build_args: "--bundles msi"
            rust_target: ""
            bundle_root: apps/desktop/src-tauri/target/release/bundle
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/SHA256SUMS-*.txt
              apps/desktop/src-tauri/target/release/bundle/RELEASE-MANIFEST-*.json
          - name: macos-arm64
            os: macos-14
            build_args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
            bundle_root: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
            artifact_paths: |
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/SHA256SUMS-*.txt
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/RELEASE-MANIFEST-*.json

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag checkout
        run: npm run release:verify-ref

      - name: Capture release git SHA
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "WARDSEN_RELEASE_SHA=$sha" >> "$GITHUB_ENV"
          echo "VITE_WARDSEN_RELEASE_SHA=$sha" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install dependencies
        run: npm ci

      - name: Capture release build timestamp
        shell: bash
        run: |
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "WARDSEN_BUILD_TIMESTAMP=$timestamp" >> "$GITHUB_ENV"
          echo "VITE_WARDSEN_BUILD_TIMESTAMP=$timestamp" >> "$GITHUB_ENV"

      - name: Derive Tauri version from release tag
        run: npm run release:set-tauri-version

      - name: Verify public release signing readiness
        env:
          WARDSEN_PUBLIC_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.prerelease == false && 'true' || 'false' }}
          WARDSEN_RELEASE_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'macos' }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: npm run release:verify-public-readiness

      - name: Check TypeScript
        run: npm run check

      - name: Test
        run: npm test

      - name: Prepare Apple notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            echo "MACOS_SIGNING_ENABLED is not true; skipping notarization key preparation."
            exit 0
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            key_path="$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Build installer
        if: runner.os != 'macOS' && runner.os != 'Windows'
        run: npm run tauri:build -- ${{ matrix.build_args }}

      - name: Build macOS installer
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            echo "MACOS_SIGNING_ENABLED is not true; building unsigned macOS artifacts."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          fi
          npm run tauri:build -- ${{ matrix.build_args }}

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run tauri:build -- --bundles msi

      - name: Sign and verify Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) {
            Write-Host "WINDOWS_CERTIFICATE_BASE64 is not configured; leaving Windows artifacts unsigned."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "wardsen-code-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          powershell -ExecutionPolicy Bypass -File .\installers\windows\sign-windows-artifacts.ps1 -PfxPath $certPath -TimestampUrl $env:WINDOWS_TIMESTAMP_URL
          Remove-Item -LiteralPath $certPath -Force

      - name: Verify macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            echo "MACOS_SIGNING_ENABLED is not true; leaving macOS artifacts unsigned."
            exit 0
          fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY is not configured."
            exit 0
          fi
          ./installers/macos/verify-macos-artifacts.sh "${{ matrix.bundle_root }}"

      - name: Generate checksums
        env:
          WARDSEN_BUNDLE_ROOT: ${{ matrix.bundle_root }}
        run: npm run release:checksums

      - name: Rename checksum file
        shell: pwsh
        run: |
          Copy-Item `
            -LiteralPath ${{ matrix.bundle_root }}/SHA256SUMS.txt `
            -Destination ${{ matrix.bundle_root }}/SHA256SUMS-${{ matrix.name }}.txt
          Copy-Item `
            -LiteralPath ${{ matrix.bundle_root }}/RELEASE-MANIFEST.json `
            -Destination ${{ matrix.bundle_root }}/RELEASE-MANIFEST-${{ matrix.name }}.json

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wardsen-${{ matrix.name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          prerelease=true
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PRERELEASE" = "false" ]; then
            prerelease=false
          fi
          draft=true
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PUBLISH" = "true" ]; then
            draft=false
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft="$draft" --prerelease="$prerelease" --title "WardSen $RELEASE_TAG" --notes-file docs/release-notes/v0.1.0.md
          else
            release_args=("$RELEASE_TAG" "--prerelease=$prerelease" "--title" "WardSen $RELEASE_TAG" "--notes-file" "docs/release-notes/v0.1.0.md")
            if [ "$draft" = "true" ]; then
              release_args+=("--draft")
            fi
            gh release create "${release_args[@]}"
          fi
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
